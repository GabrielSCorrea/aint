{% extends 'layout.html' %}

{% block content %}
<h3>List of Users</h3>

{% if users %}
<table border="1">
  <tr><th>Id</th><th>Name</th><th>Role</th></tr>
  {% for u in users %}
  <tr><td>{{u.id}}</td><td>{{u.name}}</td><td>{{u.roleName}}</td></tr>
  {% endfor %}
</table>
{% else %}
<p>No users registered.</p>
{% endif %}
{% endblock %}
