{% extends 'layout.html' %}

{% block content %}
<h3>Bulk Add Users</h3>

<p>One user per line: <code>name,password,role</code></p>
<p>Valid roles: {{ roles | join(", ") }}</p>

{% if errors %}
<div class="error">
  <p>No users were added. Fix the following lines:</p>
  <ul>
    {% for e in errors %}<li>{{e}}</li>{% endfor %}
  </ul>
</div>
{% endif %}

<form action="/users/bulk" method="post">
  <textarea name="users_text" rows="12" cols="50">{{users_text}}</textarea>
  <p><input type="submit"></p>
</form>
{% endblock %}
