<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="630" viewBox="0 0 1540 630" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1540" height="630" fill="#ffffff"/>

  <!-- ===== service cards ===== -->
  <g stroke="#c3cbd5" stroke-width="1.25" fill="#ffffff">
    <rect x="40" y="220" width="270" height="224" rx="8"/>
    <rect x="370" y="220" width="270" height="224" rx="8"/>
    <rect x="800" y="220" width="270" height="224" rx="8"/>
    <rect x="1230" y="220" width="270" height="224" rx="8"/>
  </g>
  <g fill="#1e3a5f">
    <path d="M40,264 V228 Q40,220 48,220 H302 Q310,220 310,228 V264 Z"/>
    <path d="M370,264 V228 Q370,220 378,220 H632 Q640,220 640,228 V264 Z"/>
    <path d="M800,264 V228 Q800,220 808,220 H1062 Q1070,220 1070,228 V264 Z"/>
    <path d="M1230,264 V228 Q1230,220 1238,220 H1492 Q1500,220 1500,228 V264 Z"/>
  </g>
  <g fill="#ffffff" font-size="16" font-weight="bold">
    <text x="56" y="248">User Service</text>
    <text x="386" y="248">Admin Service</text>
    <text x="816" y="248">Printing Service</text>
    <text x="1246" y="248">Correction Service</text>
  </g>
  <g fill="#b8c6d8" font-size="12.5" text-anchor="end">
    <text x="294" y="248">port 5001</text>
    <text x="624" y="248">port 5002</text>
    <text x="1054" y="248">port 5003</text>
    <text x="1484" y="248">port 5004</text>
  </g>

  <!-- role of each service -->
  <g fill="#2b3440" font-size="13">
    <text x="56" y="290">Registers the users of the system,</text>
    <text x="56" y="308">with their name, id and role.</text>

    <text x="386" y="290">Schedules exams, enrolls students</text>
    <text x="386" y="308">and orders the printing of the</text>
    <text x="386" y="326">resolution sheets.</text>

    <text x="816" y="290">Generates the PDF with the</text>
    <text x="816" y="308">resolution sheets, each one with</text>
    <text x="816" y="326">a unique QR code.</text>

    <text x="1246" y="290">Splits the scans into answers,</text>
    <text x="1246" y="308">hides the QR codes and stores</text>
    <text x="1246" y="326">the grades given by professors.</text>
  </g>

  <!-- database of each service -->
  <g stroke="#e3e7ec" stroke-width="1">
    <line x1="56" y1="346" x2="294" y2="346"/>
    <line x1="386" y1="346" x2="624" y2="346"/>
    <line x1="816" y1="346" x2="1054" y2="346"/>
    <line x1="1246" y1="346" x2="1484" y2="346"/>
  </g>
  <g stroke="#4a5562" stroke-width="1.2" fill="#e8edf3">
    <path d="M56,363 v12 a8,3 0 0 0 16,0 v-12"/><ellipse cx="64" cy="363" rx="8" ry="3"/>
    <path d="M386,363 v12 a8,3 0 0 0 16,0 v-12"/><ellipse cx="394" cy="363" rx="8" ry="3"/>
    <path d="M816,363 v12 a8,3 0 0 0 16,0 v-12"/><ellipse cx="824" cy="363" rx="8" ry="3"/>
    <path d="M1246,363 v12 a8,3 0 0 0 16,0 v-12"/><ellipse cx="1254" cy="363" rx="8" ry="3"/>
  </g>
  <g fill="#2b3440" font-size="12.5" font-weight="bold" font-family="Menlo, Consolas, monospace">
    <text x="82" y="374">users.sqlite</text>
    <text x="412" y="374">admin.sqlite</text>
    <text x="842" y="374">resolutions.sqlite</text>
    <text x="1272" y="374">corrections.sqlite</text>
  </g>
  <g fill="#5d6875" font-size="11.5" font-family="Menlo, Consolas, monospace">
    <text x="82" y="394">users</text>

    <text x="412" y="394">exams</text>
    <text x="412" y="410">enrollments</text>

    <text x="842" y="394">resolution_sheets</text>

    <text x="1272" y="394">professor_assignments</text>
    <text x="1272" y="410">exam_correction_pdfs</text>
    <text x="1272" y="426">question_corrections</text>
  </g>

  <!-- ===== users ===== -->
  <g fill="#3f4b5b">
    <circle cx="175" cy="56" r="10"/>
    <path d="M158,94 C158,76 166,71 175,71 C184,71 192,76 192,94 Z"/>
    <circle cx="505" cy="56" r="10"/>
    <path d="M488,94 C488,76 496,71 505,71 C514,71 522,76 522,94 Z"/>
    <circle cx="1430" cy="56" r="10"/>
    <path d="M1413,94 C1413,76 1421,71 1430,71 C1439,71 1447,76 1447,94 Z"/>
    <circle cx="505" cy="540" r="10"/>
    <path d="M488,578 C488,560 496,555 505,555 C514,555 522,560 522,578 Z"/>
  </g>
  <g fill="#2b3440" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="175" y="116">Super user</text>
    <text x="505" y="116">Administrator</text>
    <text x="1430" y="116">Professor</text>
    <text x="505" y="600">Student</text>
  </g>

  <!-- ===== users -> services (web pages) ===== -->
  <g stroke="#7a8796" stroke-width="1.6" fill="none">
    <line x1="175" y1="126" x2="175" y2="210"/>
    <line x1="505" y1="126" x2="505" y2="210"/>
    <polyline points="505,150 1300,150 1300,210"/>
    <line x1="1430" y1="126" x2="1430" y2="210"/>
    <line x1="505" y1="528" x2="505" y2="454"/>
    <polyline points="505,500 1300,500 1300,454"/>
  </g>
  <circle cx="505" cy="150" r="3.5" fill="#7a8796"/>
  <circle cx="505" cy="500" r="3.5" fill="#7a8796"/>
  <g fill="#7a8796">
    <polygon points="175,220 169,208 181,208"/>
    <polygon points="505,220 499,208 511,208"/>
    <polygon points="1300,220 1294,208 1306,208"/>
    <polygon points="1430,220 1424,208 1436,208"/>
    <polygon points="505,444 499,456 511,456"/>
    <polygon points="1300,444 1294,456 1306,456"/>
  </g>

  <!-- feature ids -->
  <g stroke="#7a8796" stroke-width="1.2" fill="#ffffff">
    <rect x="133" y="162" width="84" height="20" rx="10"/>
    <rect x="462" y="178" width="86" height="20" rx="10"/>
    <rect x="892" y="140" width="86" height="20" rx="10"/>
    <rect x="1388" y="162" width="84" height="20" rx="10"/>
    <rect x="483" y="462" width="44" height="20" rx="10"/>
    <rect x="913" y="490" width="44" height="20" rx="10"/>
  </g>
  <g fill="#2b3440" font-size="11.5" font-weight="bold" text-anchor="middle">
    <text x="175" y="176">SU_1–SU_3</text>
    <text x="505" y="192">AD_1–AD_3</text>
    <text x="935" y="154">AD_4, AD_5</text>
    <text x="1430" y="176">PR_1–PR_3</text>
    <text x="505" y="476">ST_1</text>
    <text x="935" y="504">ST_3</text>
  </g>

  <!-- ===== service -> service ===== -->
  <!-- XML-RPC: Admin asks Printing to print the sheets -->
  <g stroke="#2563a8" stroke-width="2" fill="none">
    <line x1="640" y1="316" x2="788" y2="316"/>
    <line x1="800" y1="346" x2="652" y2="346"/>
  </g>
  <g fill="#2563a8">
    <polygon points="800,316 788,310 788,322"/>
    <polygon points="640,346 652,340 652,352"/>
  </g>
  <g text-anchor="middle" font-size="11.5">
    <text x="720" y="272" fill="#2563a8" font-weight="bold" font-size="12">XML-RPC</text>
    <text x="720" y="290" fill="#2b3440">print_exam(exam_id, date,</text>
    <text x="720" y="304" fill="#2b3440">course, sheets_num)</text>
    <text x="720" y="366" fill="#2b3440">sheet ids</text>
  </g>

  <!-- paper: the printed sheets come back as a scan -->
  <line x1="1070" y1="316" x2="1218" y2="316" stroke="#7a8796" stroke-width="2" stroke-dasharray="6 5"/>
  <polygon points="1230,316 1218,310 1218,322" fill="#7a8796"/>
  <g text-anchor="middle" font-size="11.5" fill="#2b3440">
    <text x="1150" y="272" fill="#5d6875" font-weight="bold" font-size="12">Paper</text>
    <text x="1150" y="290">resolution sheets,</text>
    <text x="1150" y="304">QR code = sheet id</text>
    <text x="1150" y="336">answered, scanned</text>
    <text x="1150" y="350">and uploaded (AD_5)</text>
  </g>

  <!-- ===== legend ===== -->
  <g font-size="12" fill="#2b3440">
    <line x1="40" y1="516" x2="76" y2="516" stroke="#7a8796" stroke-width="1.6"/>
    <polygon points="88,516 76,510 76,522" fill="#7a8796"/>
    <text x="100" y="520">Access to the service's web pages</text>

    <line x1="40" y1="542" x2="76" y2="542" stroke="#2563a8" stroke-width="2"/>
    <polygon points="88,542 76,536 76,548" fill="#2563a8"/>
    <text x="100" y="546">Remote call between services</text>

    <line x1="40" y1="568" x2="76" y2="568" stroke="#7a8796" stroke-width="2" stroke-dasharray="6 5"/>
    <polygon points="88,568 76,562 76,574" fill="#7a8796"/>
    <text x="100" y="572">Offline link (paper sheets)</text>

    <rect x="42" y="584" width="44" height="20" rx="10" fill="#ffffff" stroke="#7a8796" stroke-width="1.2"/>
    <text x="64" y="598" text-anchor="middle" font-size="11.5" font-weight="bold">AD_1</text>
    <text x="100" y="598">Feature id from the project brief</text>
  </g>
</svg>
