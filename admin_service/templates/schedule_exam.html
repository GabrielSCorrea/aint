{% extends 'layout.html' %}

{% block content %}
<h3>Schedule Exam</h3>

{% if error %}<p style="color:red">{{error}}</p>{% endif %}

<form action="/exams/create" method="post">
  <p>Date: <input type="date" name="date" value="{{date}}"></p>
  <p>Course: <input type="text" name="course" value="{{course}}"></p>
  <input type="submit">
</form>
{% endblock %}
