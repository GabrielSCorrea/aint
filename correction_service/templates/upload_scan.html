{% extends 'layout.html' %}

{% block content %}
<h3>Upload Scan</h3>

{% if error %}<p style="color:red">{{error}}</p>{% endif %}

<p>The scanned PDF of the exam's resolution sheets, 4 pages per sheet.</p>
<form action="/scans/upload" method="post" enctype="multipart/form-data">
  <p>Exam id: <input type="text" name="exam_id" value="{{exam_id}}"></p>
  <p>PDF: <input type="file" name="pdf" accept="application/pdf"></p>
  <input type="submit">
</form>
{% endblock %}
