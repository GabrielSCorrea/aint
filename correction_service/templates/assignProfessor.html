{% extends 'layout.html' %}

{% block content %}
<h3>Assign Professor</h3>

{% if error %}<p style="color:red">{{error}}</p>{% endif %}

<form action="/assignments/create" method="post">
  <p>Exam id: <input type="text" name="examId" value="{{examId}}"></p>
  <p>Question:
    <select name="questionNumber">
      {% for q in range(1, questions + 1) %}
      <option value="{{q}}" {% if q == questionNumber %}selected{% endif %}>{{q}}</option>
      {% endfor %}
    </select>
  </p>
  <p>Professor id: <input type="text" name="professorId" value="{{professorId}}"></p>
  <input type="submit">
</form>
{% endblock %}
