{% extends 'layout.html' %}

{% block content %}
<h3>Assign Professor</h3>

{% if error %}<p class="error">{{error}}</p>{% endif %}

<form action="/assignments/create" method="post">
  <p>Exam id: <input type="text" name="exam_id" value="{{exam_id}}"></p>
  <p>Question:
    <select name="question_number">
      {% for q in range(1, questions + 1) %}
      <option value="{{q}}" {% if q == question_number %}selected{% endif %}>{{q}}</option>
      {% endfor %}
    </select>
  </p>
  <p>Professor id: <input type="text" name="professor_id" value="{{professor_id}}"></p>
  <input type="submit">
</form>
{% endblock %}
